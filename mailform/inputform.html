<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{$basic_pagetitle}</title>
	<link rel="stylesheet" type="text/css" href="css/form.css?{$update_time}" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin&display=swap" rel="stylesheet">
</head>

<body>
	<div id="wrapper">
		<div id="main">
			<form method="post" action="./">
				<div class="section">
					<h2 class="section__ttl">{$basic_formname}</h2>
					<div class="section__body">
						<div id="txt_explain">
							<p>以下のフォームに必要事項をご記入の上、「確認」をクリックしてください。<br /><span class="red">*</span>の付いている項目は必須項目です。<br /></p>
						</div>

						<div class="red_txt">
							{$form_error}
						</div>

						<table class="table" cellspacing="0">
							{$form_data}
						</table>

						<div class="button_box">
							<input type="submit" name="submit_button" value="確認" class="confirmBtn">
						</div>
					</div>
				</div>
			</form>

			<div class="back_2_top">
				<a href="{$basic_moveurl}" class="back_anchor_text">トップへ戻る</a>
			</div>
		</div>
	</div>
</body>

</html>
